services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: perf_reservations
      POSTGRES_USER: ${PERF_DB_USERNAME:-perfuser}
      POSTGRES_PASSWORD: ${PERF_DB_PASSWORD:?Set PERF_DB_PASSWORD to a local-only value}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 20
