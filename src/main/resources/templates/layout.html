<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="html(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#173b3a">
    <title th:text="${title ?: 'Núcleo | Gestão acadêmica'}">Núcleo | Gestão acadêmica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        <aside class="side-rail" id="sideRail">
            <a class="brand-lockup" th:href="${portalUser.homePath()}" aria-label="Núcleo, início">
                <span class="brand-mark"><i class="bi bi-grid-1x2-fill"></i></span>
                <span class="brand-copy"><strong>Núcleo</strong><small>gestão acadêmica</small></span>
            </a>
            <div class="rail-label">ESPAÇO DE TRABALHO</div>
            <nav class="primary-nav" aria-label="Navegação principal">
                <a class="nav-item" th:if="${portalUser.role.name() == 'ADMIN'}" th:href="@{/admin}" th:classappend="${activePage == 'home' ? ' is-active' : ''}">
                    <i class="bi bi-columns-gap"></i><span>Visão geral</span>
                </a>
                <a class="nav-item" th:if="${portalUser.role.name() == 'ADMIN'}" th:href="@{/students}" th:classappend="${activePage == 'students' ? ' is-active' : ''}">
                    <i class="bi bi-mortarboard"></i><span>Estudantes</span>
                </a>
                <a class="nav-item" th:if="${portalUser.role.name() == 'ADMIN'}" th:href="@{/teachers}" th:classappend="${activePage == 'teachers' ? ' is-active' : ''}">
                    <i class="bi bi-person-workspace"></i><span>Professores</span>
                </a>
                <a class="nav-item" th:if="${portalUser.role.name() == 'PROFESSOR'}" th:href="@{/professor}" th:classappend="${activePage == 'professor' ? ' is-active' : ''}">
                    <i class="bi bi-calendar-week"></i><span>Minha jornada</span>
                </a>
                <a class="nav-item" th:if="${portalUser.role.name() == 'RESOURCE_MANAGER'}" th:href="@{/gestora}" th:classappend="${activePage == 'gestora' ? ' is-active' : ''}">
                    <i class="bi bi-boxes"></i><span>Espaços e materiais</span>
                </a>
            </nav>
            <div class="rail-bottom">
                <span class="status-pip"></span>
                <span><strong th:text="${portalUser.displayName()}">Usuário</strong><small th:text="${portalUser.roleLabel()}">Perfil</small></span>
            </div>
        </aside>
        <main class="main-area">
            <header class="topbar">
                <button class="icon-button menu-toggle" type="button" aria-label="Abrir menu" aria-controls="sideRail" aria-expanded="false">
                    <i class="bi bi-list"></i>
                </button>
                <div class="breadcrumb-line"><span>Área de trabalho</span><i class="bi bi-chevron-right"></i><strong th:text="${activePage == 'home' ? 'Visão geral' : (activePage == 'students' ? 'Estudantes' : (activePage == 'teachers' ? 'Professores' : (activePage == 'professor' ? 'Minha jornada' : 'Espaços e materiais')))}">Visão geral</strong></div>
                <form class="topbar-actions" th:action="@{/logout}" method="post"><span class="topbar-note"><span class="status-pip"></span> Sessão ativa</span><button class="icon-button" type="submit" aria-label="Sair" title="Sair"><i class="bi bi-box-arrow-right"></i></button></form>
            </header>
            <div class="page-content" th:insert="${content}"></div>
            <footer class="app-footer"><span>Núcleo <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span></span><span>Gestão simples, dados organizados.</span></footer>
        </main>
    </div>
    <script th:src="@{/js/app.js}" defer></script>
</body>
</html>
